    *{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;background:radial-gradient(ellipse at 80% -10%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 42%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.shell{width:min(100%,980px);margin:auto;padding:16px 16px 34px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px}.brand-mark{display:grid;place-items:center;width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--gold));color:#1a1420;font-size:21px;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 30%,transparent)}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase}.top-actions{display:flex;gap:8px;align-items:center}.hero{background:linear-gradient(140deg,color-mix(in srgb,var(--accent) 26%,var(--panel)),var(--panel) 64%);border:1px solid color-mix(in srgb,var(--accent) 42%,var(--line));border-radius:26px;padding:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"✦";position:absolute;right:20px;top:10px;font-size:80px;color:color-mix(in srgb,var(--gold) 18%,transparent);pointer-events:none}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:800}.hero h1{font-size:clamp(28px,6vw,44px);line-height:1.06;margin:9px 0 12px;max-width:720px;overflow-wrap:anywhere}.hero p{color:#e0d9e8;max-width:680px;margin:0;white-space:pre-wrap}.meta-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}.meta{background:#100d1b66;border:1px solid #ffffff17;border-radius:15px;padding:12px;min-width:0}.meta b{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}.meta span{display:block;font-weight:700;overflow-wrap:anywhere}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.btn{border:1px solid var(--line);border-radius:13px;padding:11px 15px;background:var(--panel2);color:var(--text);font-weight:750;min-height:43px;transition:transform .12s,filter .12s}.btn:active{transform:scale(.98)}.btn.primary{border-color:transparent;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 75%,var(--gold)));color:#170f18}.btn.ghost{background:transparent}.btn.danger{background:#4a202b;border-color:#ff626d55}.btn.success{background:#123b32;border-color:#47cf9155}.btn.small{padding:7px 10px;min-height:34px;font-size:13px}.muted{color:var(--muted)}.section{margin-top:18px}.section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}.section-title h2{margin:0;font-size:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--panel) 78%,#100d18));border:1px solid var(--line);border-radius:var(--radius);padding:16px;min-width:0;box-shadow:0 8px 24px #0002}.card h3{margin:0 0 7px;font-size:16px}.card p{color:var(--muted);margin:6px 0 0;overflow-wrap:anywhere}.event-card{display:flex;flex-direction:column;gap:10px;min-height:150px}.event-card .actions{margin-top:auto}.status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;border:1px solid var(--line);padding:5px 8px;border-radius:30px;color:var(--muted);width:max-content}.status.active{color:var(--ok);border-color:#47cf9144}.status.draft{color:var(--gold)}.status.archived{color:#f49aa2}.tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;margin:14px 0 4px;scrollbar-width:thin}.tab{white-space:nowrap;background:transparent;border:1px solid var(--line);border-radius:30px;padding:9px 13px;color:var(--muted);font-weight:750}.tab.active{color:#1a1420;background:var(--gold);border-color:var(--gold)}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:12px;font-weight:750;color:#ddd5e6}.field input,.field textarea,.field select,.input{width:100%;background:#100d1b;border:1px solid #ffffff26;border-radius:12px;color:var(--text);padding:12px;outline:none;min-height:44px}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus,.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}.field input[type=color]{padding:4px;height:45px}.inline-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.stat{padding:14px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}.stat strong{font-size:25px;display:block;line-height:1.2}.stat span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px;margin-top:5px}.notice{border:1px solid color-mix(in srgb,var(--accent) 42%,var(--line));background:color-mix(in srgb,var(--accent) 12%,var(--panel));padding:12px 14px;border-radius:14px;color:#f3e9fa;margin:12px 0}.notice.error{border-color:#ff626d55;background:#4a202b}.notice.good{border-color:#47cf9155;background:#123b32}.hidden{display:none!important}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.wrap{display:flex;gap:8px;flex-wrap:wrap}.list{display:flex;flex-direction:column;gap:9px}.list-item{background:#181422;border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}.list-item strong{display:block;overflow-wrap:anywhere}.list-item .sub{font-size:12px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}.list-item .actions{margin-top:10px}.scanner-box{background:#100d1b;border:1px dashed #ffffff3b;border-radius:18px;padding:12px;min-height:220px}.scanner-box #reader{width:100%;max-width:560px;margin:auto}.guest-result{border:1px solid color-mix(in srgb,var(--accent) 42%,var(--line));background:linear-gradient(180deg,var(--panel),#171321);border-radius:18px;padding:16px;margin-top:14px}.pill{display:inline-block;border-radius:24px;padding:4px 8px;background:#ffffff12;color:var(--muted);font-size:11px;font-weight:800;margin:2px}.pill.good{background:#47cf9122;color:#7ce4b3}.pill.warn{background:#ffd16622;color:#ffd166}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:540px;font-size:13px}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.7px}.pass-image{width:min(100%,360px);display:block;border-radius:16px;border:1px solid var(--line);margin:12px auto;box-shadow:var(--shadow)}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#f8f5fb;color:#171321;border-radius:12px;padding:11px 16px;z-index:50;max-width:min(90vw,480px);box-shadow:var(--shadow);font-weight:750}.loading{opacity:.65;pointer-events:none}.schema-field{border:1px solid var(--line);padding:12px;border-radius:14px;margin:8px 0;background:#171321}.schema-field .inline-fields{align-items:end}.footnote{font-size:12px;color:var(--muted);margin-top:12px}.divider{height:1px;background:var(--line);margin:15px 0}
    .brand-mark img{width:100%;height:100%;object-fit:contain;border-radius:12px}.hero-banner{margin:0 0 14px;border-radius:20px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}.hero-banner img{display:block;width:100%;max-height:260px;object-fit:cover}.guest-edit{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:12px}.guest-edit summary{cursor:pointer;font-weight:750;color:var(--gold)}.sponsor-card{margin:14px 0 4px;padding:12px 16px;background:#fff;border:1px solid #d9b15f;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 10px 26px #0003;min-height:88px}.sponsor-card img{display:block;width:min(100%,360px);max-height:105px;object-fit:contain}.sponsor-label{font-size:10px;font-weight:900;letter-spacing:1.5px;color:#315078;white-space:nowrap}.theme-deepotsav body{background:radial-gradient(circle at 12% 12%,#d9b15f26 0 2px,transparent 3px),radial-gradient(circle at 88% 20%,#d9b15f22 0 3px,transparent 4px),radial-gradient(ellipse at 50% 0%,#6d328b55,transparent 58%),linear-gradient(145deg,#190d2b,#32104d 52%,#160b25)}body.theme-deepotsav{background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 58%),var(--bg)}body.theme-deepotsav .hero{background:linear-gradient(125deg,color-mix(in srgb,var(--accent) 24%,var(--panel)),var(--panel) 58%,color-mix(in srgb,var(--gold) 12%,var(--panel)));border-color:var(--gold)}body.theme-deepotsav .brand-mark{background:linear-gradient(135deg,var(--gold),#fff0b2)}
    @media(max-width:650px){.shell{padding:12px 12px 28px}.hero{padding:18px}.meta-grid{grid-template-columns:1fr;gap:8px}.grid{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.inline-fields{grid-template-columns:1fr}.topbar{align-items:flex-start}.top-actions{flex-wrap:wrap;justify-content:flex-end}.hero h1{font-size:32px}.card{padding:14px}}
    @media(min-width:800px){.shell{padding-top:24px}.hero{padding:30px}.grid.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}}
  </style>

<body>
<div class="shell" id="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" id="brandMark">✦</div><div><span id="brandTitle">KSMU HOSTEL 5 EVENTS</span><small id="brandSubtitle">EVENT MANAGEMENT</small></div></div>
    <div class="top-actions"><button class="btn ghost small hidden" id="backBtn" type="button">← All events</button><button class="btn ghost small" id="refreshBtn" type="button">↻ Refresh</button></div>
  </header>
  <main id="main"><div class="empty">Loading KSMU HOSTEL 5 EVENTS…</div></main>
</div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  const tg = window.Telegram?.WebApp;
  try { tg?.ready(); tg?.expand(); } catch (_) {}
  const params = new URLSearchParams(location.search);
  const initData = tg?.initData || '';
  const API_BASE = (params.get('api_base') || window.EVENTHUB_API_BASE || (location.protocol.startsWith('http') && !/github\.io$/.test(location.hostname) ? location.origin : '')).replace(/\/$/, '');
  const initialEventId = Number(params.get('event_id') || 0);
  const state = { role:'guest', user:null, activeEvents:[], workspaces:[], eventId:initialEventId, event:null, stats:null, page:'home', guest:null, scanner:null, formSchema:[], pass:null, checkpoints:[] };
  const $ = (id) => document.getElementById(id);
  const main = $('main');
  const safe = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const parseJSON = (v, fallback) => { try { const x = typeof v === 'string' ? JSON.parse(v || '') : v; return x ?? fallback; } catch (_) { return fallback; } };
  let toastTimer;
  function toast(message, bad=false) { const el=$('toast'); el.textContent=message; el.style.background=bad?'#ff626d':'#f8f5fb'; el.classList.remove('hidden'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.add('hidden'),3500); }
  function showNotice(message, kind='') { return `<div class="notice ${kind}">${safe(message)}</div>`; }
  function themeColour(value, fallback) { return /^#[0-9a-f]{6}$/i.test(String(value||'')) ? String(value) : fallback; }
  function eventTheme(ev) {
    const t=parseJSON(ev?.theme_json,{});
    const eventName=String(ev?.name||'').toLowerCase();
    const isDiwali=/deepotsav|deepostav|diwali/.test(eventName);
    const isHalloween=/halloween/.test(eventName);
    const primary=themeColour(t.primary,isDiwali?'#32104d':'#25113b');
    const background=themeColour(t.background,isDiwali?'#190d2b':(isHalloween?'#170F24':shade(primary,-.50)));
    const accent=themeColour(t.accent,isDiwali?'#d9b15f':'#ff7518');
    const gold=themeColour(t.gold,isDiwali?'#d9b15f':'#ffd166');
    const root=document.documentElement;
    root.style.setProperty('--bg',background);root.style.setProperty('--panel',primary);root.style.setProperty('--panel2',shade(primary,.10));
    root.style.setProperty('--accent',accent);root.style.setProperty('--gold',gold);
    document.body.classList.toggle('theme-deepotsav',isDiwali);document.body.classList.toggle('theme-halloween',isHalloween);
    document.querySelector('meta[name="theme-color"]').content=background;
    const title=document.getElementById('brandTitle'), subtitle=document.getElementById('brandSubtitle'), mark=document.getElementById('brandMark');
    if(title)title.textContent=t.app_title||'KSMU HOSTEL 5 EVENTS';if(subtitle)subtitle.textContent=t.app_subtitle||'EVENT MANAGEMENT';
    if(mark){if(t.brand_logo_url)mark.innerHTML='<img src="'+safe(t.brand_logo_url)+'" alt="" loading="lazy">';else mark.textContent=isHalloween?'🎃':(isDiwali?'🪔':'✦');}
  }
  function shade(hex, amount) {
    if(!/^#[0-9a-f]{6}$/i.test(hex)) return hex;
    const n=parseInt(hex.slice(1),16), r=Math.max(0,Math.min(255,(n>>16)+Math.round(255*amount))),g=Math.max(0,Math.min(255,((n>>8)&255)+Math.round(255*amount))),b=Math.max(0,Math.min(255,(n&255)+Math.round(255*amount)));
    return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  async function post(path, payload={}) {
    if(!API_BASE) throw new Error('API address is not configured. Ask the EventHub admin to configure the Botkeep API URL.');
    if(!initData) throw new Error('Open this page from the EventHub Telegram bot so Telegram can authenticate you.');
    const controller=typeof AbortController!=='undefined'?new AbortController():null;
    const slowAction=path==='/api/admin' && ['announcement_send','announcement_unsend','sheets_sync','refresh_event_passes'].includes(String(payload.action||'')), timer=controller?setTimeout(()=>controller.abort(),slowAction?120000:30000):null;
    let res;
    try {
      res=await fetch(API_BASE+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData,...payload}),signal:controller?.signal});
    } catch(err) {
      if(err?.name==='AbortError') throw new Error('The server took too long to respond. Check the connection and try again.');
      throw new Error('Could not reach EventHub. Check your internet connection and Botkeep API address.');
    } finally { if(timer) clearTimeout(timer); }
    let data;
    try { data=await res.json(); }
    catch(_) { throw new Error('The server returned an unreadable response. Check the Botkeep service logs.'); }
    if(!data || typeof data!=='object') throw new Error('The server returned an unexpected response.');
    if(!res.ok || data.ok===false) throw new Error(data.error || `Request failed (${res.status}).`);
    return data;
  }
  const adminCall = (action, extra={}) => post('/api/admin',{action,event_id:state.eventId,...extra});
  function updateUrl(eid, push=false) {
    const u=new URL(location.href);
    if(eid) u.searchParams.set('event_id',String(eid)); else u.searchParams.delete('event_id');
    if(API_BASE) u.searchParams.set('api_base',API_BASE);
    const next=u.pathname+u.search+u.hash;
    if(push) history.pushState({event_id:Number(eid)||0},'',next);
    else history.replaceState({event_id:Number(eid)||0},'',next);
  }
  async function setEvent(id) {
    const eid=Number(id);
    if(!Number.isSafeInteger(eid)||eid<=0) throw new Error('Invalid event selection. Refresh the event list and try again.');
    await stopScanner();
    state.eventId=eid; state.event=null; state.guest=null; state.pass=null; state.page='home'; updateUrl(eid,true);
    main.innerHTML='<div class="empty">Opening this event…</div>';
    try { await loadEvent(); }
    catch(err) { main.innerHTML=showNotice(err.message,'error')+'<div class="actions"><button class="btn" id="returnEvents">← All events</button></div>'; $('returnEvents')?.addEventListener('click',clearEvent); throw err; }
  }
  async function clearEvent() {
    await stopScanner(); state.eventId=0; state.event=null; state.guest=null; state.pass=null; state.page='events'; updateUrl(0,true); eventTheme(null); document.title='KSMU HOSTEL 5 EVENTS';
    try { await loadRole(); } catch(err) { toast(err.message,true); }
    renderEventList(); $('backBtn').classList.add('hidden');
  }
  async function loadRole() {
    const data=await post('/api/role', state.eventId?{event_id:state.eventId}:{});
    state.role=data.role||'guest'; state.user=data.user||null; state.activeEvents=data.events||[]; state.workspaces=data.workspaces||[];
    return data;
  }
  async function loadEvent() {
    if(!state.eventId) { renderEventList(); return; }
    const requestedId=state.eventId;
    const data=await post('/api/event_details',{event_id:requestedId});
    if(!data.event || Number(data.event.id)!==requestedId) throw new Error('EventHub returned a different event than the one selected. No event details were displayed.');
    state.event=data.event; eventTheme(state.event); document.title=`${state.event.name} | KSMU HOSTEL 5 EVENTS`; $('backBtn').classList.remove('hidden');
    await renderHome();
  }
  async function boot() {
    if(!initData) { main.innerHTML=showNotice('Open EventHub using the button in your Telegram bot. This page requires Telegram sign-in.','error'); return; }
    try {
      await loadRole();
      if(state.eventId) {
        const permitted=(state.role==='admin'?state.workspaces:state.activeEvents).some(e=>Number(e.id)===state.eventId);
        if(!permitted) { state.eventId=0; updateUrl(0); }
      }
      if(state.eventId) await loadEvent(); else renderEventList();
    } catch(e) { main.innerHTML=showNotice(e.message,'error')+`<div class="actions"><button class="btn" onclick="location.reload()">Try again</button></div>`; }
  }
  function renderEventList() {
    stopScanner(); $('backBtn').classList.add('hidden');
    const events=state.role==='admin'?state.workspaces:state.activeEvents;
    const list=(events||[]).filter(e=>state.role==='admin'||e.status==='active');
    main.innerHTML=`<section class="hero"><div class="eyebrow">Your event workspaces</div><h1>Choose one event</h1><p>Select an event to open its dedicated page. Only the selected event’s details, registrations, passes and scanner records will appear inside it.</p>${state.role==='admin'?`<div class="actions"><button class="btn primary" id="createEventOpen">＋ Create new event</button></div>`:''}</section>
      <section class="section"><div class="section-title"><h2>${state.role==='admin'?'All workspaces':'Active events'}</h2><span class="muted">${list.length} event${list.length===1?'':'s'}</span></div><div class="grid">${list.map(e=>`<article class="card event-card"><div class="row"><span class="status ${safe(e.status)}">${safe(e.status)}</span><span class="muted">#${Number(e.id)}</span></div><div><h3>${safe(e.name)}</h3><p class="muted">Open this event's dedicated page and tools.</p></div><div class="actions"><button class="btn primary" data-open-event="${Number(e.id)}">Open this event →</button></div></article>`).join('')||'<div class="empty">No events are available yet.</div>'}</div></section>
      ${state.role==='admin'?createEventForm():''}`;
    $('createEventOpen')?.addEventListener('click',()=>document.getElementById('createEventForm')?.scrollIntoView({behavior:'smooth',block:'center'}));
    document.querySelectorAll('[data-open-event]').forEach(b=>b.addEventListener('click',()=>setEvent(b.dataset.openEvent).catch(e=>toast(e.message,true))));
    bindCreateEvent();
  }
  function defaultSchema() {
    return [
      {key:'full_name',label:'Full name',type:'text',required:true},
      {key:'phone',label:'Phone number',type:'tel',required:true},
      {key:'residence_type',label:'Residence',type:'select',options:['Hostel','Apartment'],required:true},
      {key:'hostel_number',label:'Hostel number',type:'text',required:false},
      {key:'room_number',label:'Room number',type:'text',required:false},
      {key:'food_preference',label:'Food preference',type:'select',options:['Vegetarian','Non-vegetarian'],required:true}
    ];
  }
  function createEventForm() {
    return `<section class="section card" id="createEventForm"><div class="section-title"><h2>Create an event</h2><span class="status active">No code changes needed</span></div><form id="newEventForm"><div class="field"><label>Event name *</label><input name="name" required maxlength="120" placeholder="e.g. Halloween Night 2027"></div><div class="field"><label>Description</label><textarea name="description" maxlength="1000" placeholder="Describe this event"></textarea></div><div class="inline-fields"><div class="field"><label>Date</label><input name="event_date" type="date"></div><div class="field"><label>Time</label><input name="event_time" placeholder="e.g. 6:00 PM"></div></div><div class="field"><label>Venue</label><input name="venue" maxlength="200" placeholder="Event venue"></div><div class="inline-fields"><div class="field"><label>Primary colour</label><input name="primary" type="color" value="#25113b"></div><div class="field"><label>Accent colour</label><input name="accent" type="color" value="#ff7518"></div></div><div class="inline-fields"><div class="field"><label>Background colour</label><input name="background" type="color" value="#171321"></div><div class="field"><label>Gold / highlight</label><input name="gold" type="color" value="#ffd166"></div></div><p class="footnote">A separate event workspace and QR prefix are created automatically. You can edit the form fields after creation.</p><button class="btn primary" type="submit">Create event workspace</button></form></section>`;
  }
  function bindCreateEvent() {
    $('newEventForm')?.addEventListener('submit',async e=>{
      e.preventDefault();
      const form=e.currentTarget, submit=form.querySelector('button[type="submit"]');
      const f=new FormData(form); const name=String(f.get('name')||'').trim();
      if(name.length<3){toast('Event name must contain at least 3 characters.',true);return;}
      const theme={primary:f.get('primary'),accent:f.get('accent'),background:f.get('background'),gold:f.get('gold')};
      submit.disabled=true; submit.textContent='Creating event…';
      try {

  async function renderRegistration(host, preview=false) {

  function renderScannedGuest(message='') {
    const g=state.guest;if(!g)return;
    const actions=[];
    const activePass=g.status==='approved';
    const proofResolved=['Stored','No proof','Returned'].includes(g.proofStatus);
    if(activePass&&!g.exitRecorded&&!g.entryUsed)actions.push(['entry','Record entry','success']);
    if(activePass&&g.entryUsed&&!g.exitRecorded&&g.proofStatus==='Not collected') {
      actions.push(['proof_deposit','Store proof','']);
      actions.push(['proof_no_proof','No proof provided','']);
    }
    if(activePass&&g.entryUsed&&!g.exitRecorded&&!g.foodUsed&&proofResolved)actions.push(['food','Record food collection','success']);
    if(activePass&&g.entryUsed&&!g.exitRecorded&&g.proofStatus==='Stored')actions.push(['proof_return','Return stored proof','']);
    if(activePass&&g.entryUsed&&(g.proofStatus==='Returned'||g.proofStatus==='No proof')&&!g.exitRecorded)actions.push(['exit','Record exit','']);

  function schemaFieldEditor(f,i,total) {
    return `<div class="schema-field" data-schema-index="${i}"><div class="row"><strong>Field ${i+1}</strong><div class="wrap"><button type="button" class="btn small" data-move-schema="up" ${i===0?'disabled':''}>↑</button><button type="button" class="btn small" data-move-schema="down" ${i===total-1?'disabled':''}>↓</button><button type="button" class="btn danger small" data-remove-schema="${i}" ${f.key==='full_name'?'disabled title="The full name field is required"':''}>Remove</button></div></div><div class="inline-fields"><div class="field"><label>Key (unique)</label><input data-schema-key value="${safe(f.key||'field_'+(i+1))}" maxlength="40" ${f.key==='full_name'?'disabled title="The full_name key is required"':''}></div><div class="field"><label>Label</label><input data-schema-label value="${safe(f.label||'')}" maxlength="80"></div><div class="field"><label>Type</label><select data-schema-type ${f.key==='full_name'?'disabled':''}>${(f.key==='full_name'?['text','textarea']:['text','tel','email','number','date','textarea','select','checkbox']).map(t=>`<option ${f.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Required</label><select data-schema-required ${f.key==='full_name'?'disabled':''}><option value="false" ${!f.required?'selected':''}>No</option><option value="true" ${f.required?'selected':''}>Yes</option></select></div></div><div class="field"><label>Options (for select, comma separated)</label><input data-schema-options value="${safe((Array.isArray(f.options)?f.options:[]).join(', '))}"></div></div>`;
  }
  function readSchemaEditor() {
    const fields=[...document.querySelectorAll('[data-schema-index]')].map(el=>({
      key:el.querySelector('[data-schema-key]').value.trim(),label:el.querySelector('[data-schema-label]').value.trim(),type:el.querySelector('[data-schema-type]').value,required:el.querySelector('[data-schema-required]').value==='true',options:el.querySelector('[data-schema-options]').value.split(',').map(x=>x.trim()).filter(Boolean)
    }));
    if(fields.length<1||fields.length>30)throw new Error('A registration form must contain between 1 and 30 fields.');
    const keys=new Set();for(const f of fields){if(!/^[a-zA-Z][a-zA-Z0-9_]{0,39}$/.test(f.key))throw new Error('Each field needs a valid key beginning with a letter.');if(keys.has(f.key))throw new Error(`Duplicate field key: ${f.key}`);keys.add(f.key);if(!f.label)throw new Error('Every form field needs a label.');if(f.type==='select'&&f.options.length===0)throw new Error(`Add at least one option for ${f.label}.`);}
    const full=fields.find(f=>f.key==='full_name');if(!full)throw new Error('The registration form must contain a full_name field.');if(!['text','textarea'].includes(full.type))throw new Error('The full_name field must use text or textarea.');full.required=true;return fields;
  }

      pass_room_label:$('editPassRoomLabel').value,pass_code_label:$('editPassCodeLabel').value,pass_date_label:$('editPassDateLabel').value,
      pass_time_label:$('editPassTimeLabel').value,pass_venue_label:$('editPassVenueLabel').value,
      pass_qr_foreground:$('editPassQrForeground').value,pass_qr_background:$('editPassQrBackground').value,pass_border_color:$('editPassBorderColor').value,
      pass_qr_size:Number($('editPassQrSize').value),pass_qr_border:Number($('editPassQrBorder').value),pass_border_width:Number($('editPassBorderWidth').value),
      pass_qr_error_correction:$('editPassQrError').value,
      pass_show_role:$('editPassShowRole').checked,pass_show_name_label:$('editPassShowNameLabel').checked,pass_show_phone:$('editPassShowPhone').checked,
      pass_show_food:$('editPassShowFood').checked,pass_show_residence:$('editPassShowResidence').checked,pass_show_room:$('editPassShowRoom').checked,
      pass_show_pass_code:$('editPassShowCode').checked,pass_show_date:$('editPassShowDate').checked,pass_show_time:$('editPassShowTime').checked,
      pass_show_venue:$('editPassShowVenue').checked,pass_show_instruction:$('editPassShowInstruction').checked,pass_show_privacy:$('editPassShowPrivacy').checked,
      pass_instruction:$('editPassInstruction').value,pass_privacy:$('editPassPrivacy').value
    };}
    $('refreshExistingPasses').addEventListener('click',async()=>{
      const button=$('refreshExistingPasses');
      if(!confirm('Send the newly saved QR pass design to every approved guest in this event? This sends a new pass image to each guest, but preserves their existing QR token and pass code.'))return;
      button.disabled=true;const original=button.textContent;button.textContent='Sending updated passes…';
      try{const result=await adminCall('refresh_event_passes',{confirm:true});
        $('settingsMessage').innerHTML=showNotice(result.message+(result.failed?' Failed deliveries: '+result.failed+'. You can retry after checking Botkeep logs.':''),'good');
        toast(result.message);
      }catch(err){$('settingsMessage').innerHTML=showNotice(err.message,'error');}
      finally{button.disabled=false;button.textContent=original;}
    });
    const backgroundInput=$('editPassBackgroundUpload'),backgroundValue=$('editPassBackgroundImage'),backgroundPreview=$('passBackgroundPreview');
    const showPassBackground=()=>{const value=backgroundValue.value;backgroundPreview.innerHTML=value?'<img alt="QR pass background preview" style="display:block;width:min(100%,260px);max-height:220px;object-fit:cover;border-radius:12px;border:1px solid var(--line)" src="'+safe(value)+'">':'<p class="muted">No custom background uploaded. Event colour will be used.</p>';};
    showPassBackground();
    backgroundInput.addEventListener('change',()=>{const file=backgroundInput.files&&backgroundInput.files[0];if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)){toast('Choose a PNG, JPG or WebP image.',true);backgroundInput.value='';return;}if(file.size>1024*1024){toast('Image must be 1 MB or smaller.',true);backgroundInput.value='';return;}const reader=new FileReader();reader.onload=()=>{backgroundValue.value=String(reader.result||'');showPassBackground();toast('Background loaded. Save event settings to apply it.');};reader.onerror=()=>toast('Could not read this image. Try another file.',true);reader.readAsDataURL(file);});
    $('removePassBackground').addEventListener('click',()=>{backgroundValue.value='';backgroundInput.value='';showPassBackground();toast('Custom background removed. Save settings to apply.');});
    $('previewQrPass').addEventListener('click',async()=>{
      const button=$('previewQrPass'),target=$('qrPassPreview');
      button.disabled=true;target.innerHTML='<div class="notice">Generating a preview-only pass using the last saved design…</div>';
      try{const result=await adminCall('preview_pass',{preview_name:'Sample Guest',preview_phone:'+7 900 000 00 00',preview_residence:'Hostel',preview_hostel:'5',preview_room:'392',preview_food:'Vegetarian'});
        target.innerHTML='<div class="notice good">Preview only. This QR is not a real guest pass and cannot be used for entry.</div><img class="pass-image" alt="QR pass design preview" src="data:image/png;base64,'+result.pass.image+'">';
      }catch(err){target.innerHTML=showNotice(err.message,'error');}finally{button.disabled=false;}
    });
    $('generateEventAdminQr').addEventListener('click',async()=>{
      const b=$('generateEventAdminQr'),target=$('eventAdminQrResult');b.disabled=true;target.innerHTML='<div class="notice">Generating signed event QR…</div>';
      try{const r=await adminCall('event_qr_generate');target.innerHTML='<div class="notice good">Signed admin QR ready for '+safe(r.event_name)+'. Keep it in a controlled admin location.</div><img alt="Signed admin event QR" style="display:block;width:min(100%,320px);height:auto;background:#fff;padding:12px;border-radius:14px;margin-top:12px" src="data:image/png;base64,'+r.image+'">';const a=$('downloadEventAdminQr');a.href='data:image/png;base64,'+r.image;a.hidden=false;}
      catch(err){target.innerHTML=showNotice(err.message,'error');}finally{b.disabled=false;}
    });
    $('settingsForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.currentTarget.querySelector('button[type="submit"]');btn.disabled=true;theme=collectTheme();
      try{const r=await adminCall('update_event',{name:$('editName').value,description:$('editDescription').value,event_date:$('editDate').value,event_time:$('editTime').value,venue:$('editVenue').value,theme});
        await loadEvent();await renderAdminPage('settings');toast('Event, Mini App branding and QR pass design saved');
      }catch(err){$('settingsMessage').innerHTML=showNotice(err.message,'error');}finally{btn.disabled=false;}
    });
    if(host.dataset.schemaAddBound!=='1'){host.dataset.schemaAddBound='1';host.addEventListener('click',e=>{if(!e.target.closest('#addSchemaField'))return;try{const arr=readSchemaEditor();if(arr.length>=30)throw new Error('A registration form can have at most 30 fields.');arr.push({key:'custom_'+(arr.length+1),label:'New field',type:'text',required:false,options:[]});$('schemaBuilder').outerHTML=schemaEditor(arr);bindSchemaEditorButtons();}catch(err){toast(err.message,true);}});}
    bindSchemaEditorButtons();
    $('saveSchema').addEventListener('click',async()=>{try{const arr=readSchemaEditor();const r=await adminCall('update_event',{name:$('editName').value,description:$('editDescription').value,event_date:$('editDate').value,event_time:$('editTime').value,venue:$('editVenue').value,theme:collectTheme(),registration_schema:arr});$('schemaMessage').innerHTML=showNotice(r.message||'Registration form saved.','good');const d=await post('/api/event_details',{event_id:state.eventId});state.event=d.event;toast('Registration form saved');}catch(err){$('schemaMessage').innerHTML=showNotice(err.message,'error');}});
    $('activateEvent')?.addEventListener('click',async()=>{if(!confirm(`Activate ${ev.name}? It will become visible to guests and registration/scanning will open.`))return;const btn=$('activateEvent');btn.disabled=true;try{const r=await adminCall('activate_event');$('archiveMessage').innerHTML=showNotice(r.message||'Event activated.','good');await loadRole();await loadEvent();toast('Event activated');}catch(err){$('archiveMessage').innerHTML=showNotice(err.message,'error');btn.disabled=false;}});
    $('archiveEvent')?.addEventListener('click',async()=>{if(!confirm(`Archive ${ev.name}? New registrations and scans will stop.`))return;const btn=$('archiveEvent');btn.disabled=true;try{const r=await post('/api/admin',{action:'archive_event',event_id:state.eventId});$('archiveMessage').innerHTML=showNotice(r.message,'good');await loadRole();setTimeout(clearEvent,800);}catch(err){$('archiveMessage').innerHTML=showNotice(err.message,'error');btn.disabled=false;}});
    $('saveBotSettings').addEventListener('click',async()=>{
      const button=$('saveBotSettings'),target=$('botSettingsMessage');button.disabled=true;const original=button.textContent;button.textContent='Saving bot settings…';
      try{
        const messages={};botMessageGroups.forEach(g=>g.fields.forEach(([key])=>messages[key]=$('botMsg_'+key).value));
        const buttons={};botButtonFields.forEach(([key])=>buttons[key]=$('botBtn_'+key).value);
        const features={};botFeatureFields.forEach(([key])=>features[key]=$('botFeature_'+key).checked);
        const bot_settings={messages,buttons,features,support_url:$('botSupportUrl').value};
        const result=await adminCall('save_bot_settings',{bot_settings});
        state.event.bot_settings_json=JSON.stringify(result.bot_settings||bot_settings);
        target.innerHTML=showNotice(result.message||'Telegram bot settings saved.','good');toast('Telegram bot settings saved');
      }catch(err){target.innerHTML=showNotice(err.message,'error');}
      finally{button.disabled=false;button.textContent=original;}
    });
    $('backToEvents').addEventListener('click',clearEvent);
  }
  function bindSchemaEditorButtons(){
    document.querySelectorAll('[data-remove-schema]').forEach(b=>{if(b.dataset.bound==='1')return;b.dataset.bound='1';b.addEventListener('click',()=>{const row=b.closest('[data-schema-index]');row?.remove();renumberSchema();});});
    document.querySelectorAll('[data-move-schema]').forEach(b=>{if(b.dataset.bound==='1')return;b.dataset.bound='1';b.addEventListener('click',()=>{const row=b.closest('[data-schema-index]');if(!row)return;const neighbour=b.dataset.moveSchema==='up'?row.previousElementSibling:row.nextElementSibling;if(!neighbour)return;if(b.dataset.moveSchema==='up')row.parentNode.insertBefore(row,neighbour);else row.parentNode.insertBefore(neighbour,row);renumberSchema();});});
  }
  function renumberSchema(){const rows=[...document.querySelectorAll('[data-schema-index]')];rows.forEach((el,i)=>{el.dataset.schemaIndex=i;const t=el.querySelector('.row strong');if(t)t.textContent='Field '+(i+1);const rm=el.querySelector('[data-remove-schema]');if(rm)rm.dataset.removeSchema=i;const up=el.querySelector('[data-move-schema="up"]');const down=el.querySelector('[data-move-schema="down"]');if(up)up.disabled=i===0;if(down)down.disabled=i===rows.length-1;});}
  async function renderCheckpoints(host) {
    const archived=state.event?.status==='archived';
    host.innerHTML=`${archived?showNotice('Archived checkpoints are read-only.','error'):''}<div class='section-title'><h2>Checkpoint configuration</h2><button class='btn small' id='refreshCheckpoints'>↻ Refresh</button></div>${archived?'':`<section class='card'><form id='checkpointForm'><div class='inline-fields'><div class='field'><label>Checkpoint name</label><input id='checkpointName' required maxlength='100' placeholder='e.g. Main Entry'></div><div class='field'><label>Checkpoint type</label><select id='checkpointType'><option value='entry'>Entry</option><option value='food'>Food collection</option><option value='workshop'>Workshop</option><option value='other'>Other</option></select></div></div><button class='btn primary' type='submit'>＋ Add checkpoint</button></form><div id='checkpointMessage'></div></section>`}<div id='checkpointList' class='list section'></div>`;
    const load=async()=>{
      try{
        const r=await adminCall('checkpoints');
        $('checkpointList').innerHTML=(r.checkpoints||[]).map(c=>`<article class='list-item' data-checkpoint-id='${Number(c.id)}'><div class='row'><strong>${safe(c.name)}</strong><span class='pill ${Number(c.enabled)?'good':'warn'}'>${Number(c.enabled)?'Enabled':'Disabled'}</span></div><div class='sub'>${safe(c.checkpoint_type)} · Checkpoint #${Number(c.id)}</div>${archived?'':`<form data-checkpoint-edit='${Number(c.id)}'><div class='inline-fields'><div class='field'><label>Name</label><input name='name' required maxlength='100' value='${safe(c.name)}'></div><div class='field'><label>Type</label><select name='checkpoint_type'><option value='entry' ${c.checkpoint_type==='entry'?'selected':''}>Entry</option><option value='food' ${c.checkpoint_type==='food'?'selected':''}>Food</option><option value='workshop' ${c.checkpoint_type==='workshop'?'selected':''}>Workshop</option><option value='other' ${c.checkpoint_type==='other'?'selected':''}>Other</option></select></div></div><label><input name='enabled' type='checkbox' ${Number(c.enabled)?'checked':''} style='width:auto;min-height:0'> Enabled for scanning</label><div class='actions'><button class='btn primary small' type='submit'>Save</button><button class='btn danger small' type='button' data-delete-checkpoint='${Number(c.id)}'>Delete</button></div></form>`}</article>`).join('')||'<div class="empty">No checkpoints created for this event.</div>';
        if(!archived){
          document.querySelectorAll('form[data-checkpoint-edit]').forEach(form=>form.addEventListener('submit',async e=>{e.preventDefault();const btn=form.querySelector('button[type=submit]');btn.disabled=true;const fd=new FormData(form);try{const rr=await adminCall('update_checkpoint',{checkpoint_id:Number(form.dataset.checkpointEdit),name:fd.get('name'),checkpoint_type:fd.get('checkpoint_type'),enabled:fd.get('enabled')==='on'});toast(rr.message||'Checkpoint saved');await load();}catch(err){toast(err.message,true);btn.disabled=false;}}));
          document.querySelectorAll('[data-delete-checkpoint]').forEach(btn=>btn.addEventListener('click',async()=>{if(!confirm('Delete this checkpoint? Checkpoints with scan history cannot be deleted; disable them instead.'))return;btn.disabled=true;try{const rr=await adminCall('delete_checkpoint',{checkpoint_id:Number(btn.dataset.deleteCheckpoint)});toast(rr.message||'Checkpoint deleted');await load();}catch(err){toast(err.message,true);btn.disabled=false;}}));
        }
      }catch(err){$('checkpointList').innerHTML=showNotice(err.message,'error');}
    };
    $('refreshCheckpoints').addEventListener('click',load);
    if(!archived)$('checkpointForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.currentTarget.querySelector('button[type=submit]');btn.disabled=true;try{const rr=await adminCall('create_checkpoint',{name:$('checkpointName').value,checkpoint_type:$('checkpointType').value});$('checkpointMessage').innerHTML=showNotice(rr.message||'Checkpoint created.','good');$('checkpointForm').reset();await load();}catch(err){$('checkpointMessage').innerHTML=showNotice(err.message,'error');}finally{btn.disabled=false;}});
    await load();
  }

  async function renderAdmins(host) {
    host.innerHTML=`<div class='section-title'><h2>Admin access</h2><button class='btn small' id='refreshAdmins'>↻ Refresh</button></div><section class='card'><form id='addAdminForm'><div class='field'><label>Telegram user ID</label><input id='newAdminId' inputmode='numeric' pattern='[0-9]+' required placeholder='123456789'></div><button class='btn primary' type='submit'>＋ Grant admin access</button></form><p class='footnote'>Only grant admin access to trusted organisers. Botkeep owner/recovery admins are protected.</p></section><div id='adminList' class='list section'></div>`;
    const load=async()=>{
      try{
        const r=await adminCall('admins');const protectedIds=new Set((r.configured_admin_ids||[]).map(Number));
        $('adminList').innerHTML=(r.admins||[]).map(a=>`<article class='list-item row'><div><strong>Telegram ID ${Number(a.telegram_id)}</strong><div class='sub'>Added ${safe(a.added_at||'')} · ${protectedIds.has(Number(a.telegram_id))?'Protected owner/recovery admin':'Dashboard admin'}</div></div>${protectedIds.has(Number(a.telegram_id))?'<span class="pill">Protected</span>':`<button class='btn danger small' data-remove-admin='${Number(a.telegram_id)}'>Remove access</button>`}</article>`).join('')||'<div class="empty">No dashboard admins listed.</div>';
        document.querySelectorAll('[data-remove-admin]').forEach(btn=>btn.addEventListener('click',async()=>{if(!confirm('Remove admin access for Telegram ID '+btn.dataset.removeAdmin+'?'))return;btn.disabled=true;try{const rr=await adminCall('remove_admin',{telegram_id:Number(btn.dataset.removeAdmin)});toast(rr.message||'Admin access removed');await load();}catch(err){toast(err.message,true);btn.disabled=false;}}));
      }catch(err){$('adminList').innerHTML=showNotice(err.message,'error');}
    };
    $('refreshAdmins').addEventListener('click',load);
    $('addAdminForm').addEventListener('submit',async e=>{e.preventDefault();const btn=e.currentTarget.querySelector('button[type=submit]');btn.disabled=true;try{const rr=await adminCall('add_admin',{telegram_id:Number($('newAdminId').value)});toast(rr.message||'Admin access granted');$('newAdminId').value='';await load();}catch(err){toast(err.message,true);}finally{btn.disabled=false;}});
    await load();
  }
  async function renderStaff(host) {
    host.innerHTML=`<div class="section-title"><h2>Volunteer access</h2><button class="btn small" id="refreshStaff">Refresh</button></div><section class="card"><form id="addVolunteer"><div class="field"><label>Telegram user ID</label><input id="volunteerId" inputmode="numeric" placeholder="123456789" required></div><button class="btn primary" type="submit">Add volunteer</button></form><p class="footnote">Volunteer accounts are shared across EventHub. Their event data and QR scans remain separate for each selected event.</p></section><div id="volunteerList" class="list section"></div>`;
    const load=async()=>{try{const r=await adminCall('volunteers');$('volunteerList').innerHTML=(r.volunteers||[]).map(v=>`<div class="list-item row"><div><strong>${v.telegram_id}</strong><div class="sub">Added ${safe(v.added_at||'')}</div></div><button class="btn danger small" data-remove-vol="${v.telegram_id}">Remove</button></div>`).join('')||'<div class="empty">No volunteers assigned.</div>';document.querySelectorAll('[data-remove-vol]').forEach(b=>b.addEventListener('click',async()=>{if(!confirm('Remove volunteer scanner access?'))return;try{const r=await adminCall('remove_volunteer',{telegram_id:Number(b.dataset.removeVol)});toast(r.message);load();}catch(e){toast(e.message,true);}}));}catch(e){$('volunteerList').innerHTML=showNotice(e.message,'error');}};
    $('refreshStaff').addEventListener('click',load);$('addVolunteer').addEventListener('submit',async e=>{e.preventDefault();try{const r=await adminCall('add_volunteer',{telegram_id:Number($('volunteerId').value)});toast(r.message);$('volunteerId').value='';load();}catch(err){toast(err.message,true);}});await load();
  }
  async function refresh() { try{await stopScanner();await loadRole();if(state.eventId)await loadEvent();else renderEventList();toast('Updated');}catch(e){toast(e.message,true);} }
  $('refreshBtn').addEventListener('click',refresh);$('backBtn').addEventListener('click',clearEvent);
  window.addEventListener('popstate',async()=>{
    const nextId=Number(new URLSearchParams(location.search).get('event_id')||0);
    await stopScanner(); state.eventId=Number.isSafeInteger(nextId)&&nextId>0?nextId:0; state.event=null; state.guest=null; state.pass=null;
    try { await loadRole(); if(state.eventId){const permitted=(state.role==='admin'?state.workspaces:state.activeEvents).some(e=>Number(e.id)===state.eventId); if(permitted) await loadEvent(); else {state.eventId=0;eventTheme(null);renderEventList();}} else {eventTheme(null);renderEventList();} } catch(err){main.innerHTML=showNotice(err.message,'error');}
  });
  boot();
})();
</script>
